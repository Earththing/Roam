<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roam — how far can I get?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥾</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <aside id="panel">
    <h1>Roam</h1>
    <p class="hint">Click the map to set a starting point, or search:</p>
    <div class="row">
      <input id="search" type="text" placeholder="Search address or place…" />
    </div>
    <ul id="search-results"></ul>

    <h2>Saved places</h2>
    <div id="places" class="chips"></div>
    <button id="save-place" class="ghost" disabled>＋ Save current start…</button>

    <h2>Mode</h2>
    <div id="modes" class="btn-group"></div>
    <div id="planned-modes" class="planned"></div>

    <h2>Limit</h2>
    <div class="row">
      <select id="limit-type">
        <option value="time">Time (min)</option>
        <option value="distance">Distance</option>
      </select>
      <input id="limit-value" type="number" value="15" min="0.5" step="0.5" />
      <select id="units" title="Units for distances">
        <option value="mi">mi</option>
        <option value="km">km</option>
      </select>
    </div>
    <input id="limit-slider" type="range" min="1" max="120" value="15" />
    <div class="row" style="margin-top: 6px">
      <select id="rings" title="Show graduated bands at fractions of the limit">
        <option value="1">Single area</option>
        <option value="2">2 bands</option>
        <option value="3">3 bands</option>
        <option value="4">4 bands</option>
      </select>
    </div>

    <h2>Overlays</h2>
    <label><input type="checkbox" id="ov-loops" /> Loop routes</label>
    <label><input type="checkbox" id="ov-oab" /> Out-and-back routes</label>
    <label><input type="checkbox" id="ov-tree" /> Reachable streets</label>

    <button id="go" disabled>Shade the map</button>

    <div id="progress" hidden>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="progress-row">
        <span id="progress-stage"></span>
        <span id="progress-time"></span>
      </div>
      <button id="cancel" class="ghost">Cancel</button>
    </div>

    <div id="status"></div>
    <div id="routes"></div>
  </aside>
  <div id="divider" title="Drag to resize"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
